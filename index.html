
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pix - Lupharma</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 440px;
            padding: 35px 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        h1 {
            font-size: 22px;
            color: #005526;
            margin-bottom: 10px;
        }
        .subtitulo {
        color: #005526;
        font-size: 16px;
        margin-top: -5px;
        margin-bottom: 25px;
        }

        .chave {
        background: #f1f4ef;
        padding: 15px;
        border-radius: 10px;
        margin: 25px 0;
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #005526;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        #mensagem {
            margin-top: 15px;
            color: #005526;
            font-weight: bold;
        }

        #mensagem:empty {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>LUPHARMA</h1>

    <p class="subtitulo">
        Farmácia de Manipulação
    </p>

    <div class="chave" id="chavePix">
        lupharmanipulacao@gmail.com
    </div>

    <button onclick="copiarPix()">
        📋 COPIAR CHAVE PIX
    </button>

    <div id="mensagem" aria-live="polite"></div>

</div>

<script>
async function copiarPix() {
    const chave = "lupharmanipulacao@gmail.com";
    const mensagem = document.getElementById("mensagem");

    try {
        await navigator.clipboard.writeText(chave);
        mensagem.innerText = "✓ Chave Pix copiada!";
    } catch (erro) {
        mensagem.innerText =
            "Não foi possível copiar automaticamente. Selecione a chave acima para copiar.";
    }
}
</script>

</body>
</html>
